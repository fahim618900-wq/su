<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5f7a">
<title>ফলাফল ২০২৬ | দারুল হিকমাহ মডেল মাদরাসা</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f7f6;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-dim: #666;
    --border: #e0e0e0;
    --primary: #1a5f7a;
    --primary-dark: #0f4459;
    --accent: #27ae60;
    --danger: #e74c3c;
    --gold: #f39c12;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #0f1720;
    --card: #1a2430;
    --text: #e8eef5;
    --text-dim: #8a9aac;
    --border: #2a3a4a;
    --primary: #4a9cc0;
    --primary-dark: #2d7a9e;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
  }
  html, body {
    height: 100%;
    font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 100vw;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ HEADER ============ */
  .app-header {
    background: var(--card);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
    transition: background 0.3s;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 18px;
    box-shadow: 0 3px 10px rgba(26,95,122,0.3);
  }
  .brand-text h1 { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .brand-text p { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .theme-toggle {
    width: 40px; height: 40px;
    border: none; background: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px;
    transition: transform 0.3s, background 0.3s;
    color: var(--text);
  }
  .theme-toggle:active { transform: scale(0.92); }

  /* ============ SEARCH BOX ============ */
  .search-wrap { position: relative; }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 0 6px 0 14px;
    height: 52px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .search-box.focused {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(26,95,122,0.12);
  }
  .search-box .icon-search {
    font-size: 18px; color: var(--text-dim);
    margin-right: 8px; flex-shrink: 0;
  }
  #searchInput {
    flex: 1;
    border: none; outline: none;
    background: transparent;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
    padding: 0;
    min-width: 0;
  }
  #searchInput::placeholder { color: var(--text-dim); font-size: 15px; }
  .btn-clear, .btn-voice {
    width: 38px; height: 38px;
    border: none; background: transparent;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px;
    color: var(--text-dim);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .btn-clear:active, .btn-voice:active { background: var(--border); }
  .btn-voice.listening {
    background: var(--danger); color: white;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.6); }
    50% { box-shadow: 0 0 0 10px rgba(231,76,60,0); }
  }
  .btn-clear { display: none; }
  .btn-clear.visible { display: flex; }

  /* ============ FILTERS ============ */
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 2px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    padding: 7px 16px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
    font-family: inherit;
  }
  .chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 3px 10px rgba(26,95,122,0.3);
  }
  .chip:active { transform: scale(0.95); }

  /* ============ SORT BAR ============ */
  .sort-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    position: sticky;
    top: 100px;
    z-index: 50;
  }
  .sort-bar select {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }

  /* ============ MAIN ============ */
  main { flex: 1; padding: 12px 16px 80px; }

  /* ============ AUTOCOMPLETE ============ */
  .autocomplete {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    max-height: 240px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    border: 1px solid var(--border);
  }
  .autocomplete.show { display: block; }
  .ac-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:active { background: var(--bg); }
  .ac-item .ac-icon { font-size: 16px; color: var(--primary); flex-shrink: 0; }
  .ac-item .ac-text { flex: 1; }
  .ac-item mark {
    background: rgba(39,174,96,0.25);
    color: var(--accent);
    font-weight: 700;
    padding: 1px 3px;
    border-radius: 3px;
  }
  .ac-item .ac-type {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* ============ RECENT SEARCH ============ */
  .recent-section { margin-bottom: 16px; }
  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .section-title .clear-history {
    font-size: 12px; color: var(--danger);
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-weight: 600;
    padding: 4px 8px;
  }
  .recent-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .recent-chip {
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .recent-chip:active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* ============ RESULT META ============ */
  .result-meta {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .result-meta strong { color: var(--primary); font-weight: 700; }

  /* ============ RESULT CARDS ============ */
  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.3s ease both;
    position: relative;
    overflow: hidden;
  }
  .result-card:active {
    transform: scale(0.98);
    box-shadow: var(--shadow-lg);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }
  .card-name mark {
    background: linear-gradient(180deg, transparent 60%, rgba(39,174,96,0.35) 60%);
    color: var(--accent);
    font-weight: 800;
    padding: 0 2px;
    border-radius: 2px;
  }
  .type-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .type-student { background: rgba(26,95,122,0.15); color: var(--primary); }
  .type-subject { background: rgba(155,89,182,0.15); color: #8e44ad; }
  .type-book    { background: rgba(39,174,96,0.15); color: var(--accent); }
  .type-note    { background: rgba(243,156,18,0.18); color: #d68910; }
  .type-pdf     { background: rgba(231,76,60,0.15); color: var(--danger); }

  .card-info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .card-info span { display: flex; align-items: center; gap: 4px; }
  .card-info strong { color: var(--text); font-weight: 600; }

  .card-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .card-desc mark {
    background: rgba(39,174,96,0.25);
    color: var(--accent);
    font-weight: 700;
    padding: 0 2px;
    border-radius: 2px;
  }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, var(--gold), #e67e22);
    color: white;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .rank-badge.shared {
    background: linear-gradient(135deg, #9b59b6, #8e44ad);
  }
  .rank-badge.rank1 { background: linear-gradient(135deg, #f1c40f, #f39c12); }
  .rank-badge.rank2 { background: linear-gradient(135deg, #bdc3c7, #95a5a6); }
  .rank-badge.rank3 { background: linear-gradient(135deg, #cd7f32, #b87333); }

  .marks-highlight {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }

  .relevance-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 0 3px 0 0;
    transition: width 0.4s;
  }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.4s ease;
  }
  .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty-text {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .suggestion-chip {
    padding: 10px 16px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .suggestion-chip:active { background: var(--primary); color: white; }

  /* ============ WELCOME ============ */
  .welcome { text-align: center; padding: 30px 20px; }
  .welcome-icon {
    font-size: 72px;
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .welcome-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }
  .welcome-text {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .quick-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .quick-tag {
    padding: 10px 16px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .quick-tag:active {
    transform: scale(0.95);
    background: var(--primary);
    color: white;
  }

  /* ============ LOAD MORE ============ */
  .load-more {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .load-more:active { background: var(--bg); }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: var(--card);
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 999;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ SCROLL TOP ============ */
  .scroll-top {
    position: fixed;
    bottom: 20px;
    right: 16px;
    width: 46px; height: 46px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 90;
  }
  .scroll-top.show { opacity: 1; transform: translateY(0); }
  .scroll-top:active { transform: scale(0.9); }
</style>
</head>
<body data-theme="light">

<!-- HEADER -->
<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-logo">🎓</div>
      <div class="brand-text">
        <h1>ফলাফল ২০২৬</h1>
        <p>দারুল হিকমাহ মডেল মাদরাসা</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="থিম পরিবর্তন">🌙</button>
  </div>

  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <span class="icon-search">🔎</span>
      <input
        type="text"
        id="searchInput"
        placeholder="শিক্ষার্থীর নাম বা শ্রেণি লিখুন..."
        autocomplete="off"
        spellcheck="false"
        inputmode="search"
      >
      <button class="btn-clear" id="btnClear" aria-label="মুছুন">✕</button>
      <button class="btn-voice" id="btnVoice" aria-label="ভয়েস সার্চ">🎤</button>
    </div>
    <div class="autocomplete" id="autocomplete"></div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">সব</button>
    <button class="chip" data-filter="play">প্লে</button>
    <button class="chip" data-filter="nursery">নার্সারি</button>
    <button class="chip" data-filter="1">১ম</button>
    <button class="chip" data-filter="2">২য়</button>
    <button class="chip" data-filter="3">৩য়</button>
    <button class="chip" data-filter="4">৪র্থ</button>
    <button class="chip" data-filter="5">৫ম</button>
    <button class="chip" data-filter="6">৬ষ্ঠ</button>
  </div>
</header>

<div class="sort-bar" id="sortBar" style="display:none;">
  <span id="resultMeta">ফলাফল</span>
  <select id="sortSelect">
    <option value="relevance">সবচেয়ে প্রাসঙ্গিক</option>
    <option value="rank">মেধাস্থান (ক → ব)</option>
    <option value="marks">সর্বোচ্চ নম্বর</option>
    <option value="az">নাম (ক → হ)</option>
    <option value="za">নাম (হ → ক)</option>
  </select>
</div>

<main id="main">
  <!-- Welcome -->
  <div class="welcome" id="welcomeState">
    <div class="welcome-icon">🎓</div>
    <div class="welcome-title">৩য় সেমিস্টার পরীক্ষার ফলাফল — ২০২৬</div>
    <div class="welcome-text">
      শিক্ষার্থীর নাম বা শ্রেণি টাইপ করে খুঁজুন<br>
      সার্চ না করলে কিছু দেখানো হবে না
    </div>
    <div class="quick-tags" id="quickTags"></div>
  </div>

  <!-- Recent -->
  <div class="recent-section" id="recentSection" style="display:none;">
    <div class="section-title">
      <span>🕘 সাম্প্রতিক সার্চ</span>
      <button class="clear-history" id="clearHistory">সব মুছুন</button>
    </div>
    <div class="recent-chips" id="recentChips"></div>
  </div>

  <!-- Results -->
  <div id="resultsArea" style="display:none;">
    <div class="result-meta" id="resultCount"></div>
    <div class="result-list" id="resultList"></div>
    <button class="load-more" id="loadMore" style="display:none;">আরও দেখুন</button>
  </div>

  <!-- Empty -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🔍</div>
    <div class="empty-title">কিছু পাওয়া যায়নি</div>
    <div class="empty-text" id="emptyText">
      এই নামে কোনো শিক্ষার্থী পাওয়া যায়নি।<br>বানান ঠিক করে আবার চেষ্টা করুন।
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<button class="scroll-top" id="scrollTop" aria-label="উপরে যান">↑</button>

<script>
/* ============================================================
   1) সম্পূর্ণ ডাটাবেজ — সব শ্রেণির শিক্ষার্থী
   ============================================================ */
const RAW_DATA = {
  play: [
    { id:'০১', name:'রাফিয়া', marks:[100,99,99,95,100] },
    { id:'০২', name:'সাদাত', marks:[75,60,94,59,88] },
    { id:'০৩', name:'রাকিন', marks:[100,100,100,99,95] },
    { id:'০৪', name:'ইরফান', marks:[100,96,98,96,99] },
    { id:'০৫', name:'হুজাইফা', marks:[100,99,99,96,96] },
    { id:'০৬', name:'আকসা', marks:[100,98,99,99,98] },
    { id:'০৭', name:'রাইফা', marks:[91,88,85,88,90] },

  '3': [['কুরআন',100],['আকাইদ',100],['আরবী',100],['বাংলা',100],['ইংরেজী',100],['গণিত',100],['বিজ্ঞান',100],['বা ও বি',100],['সাঃ জ্ঞান ও কম্পিউটার',100]],
  '4': [['কুরআন',100],['কোরআন যৌথ',100],['আরবী ১ম',100],['আরবী ২য়',100],['বাংলা',100],['ইংরেজী',100],['গণিত',100],['বিজ্ঞান',100],['কম্পিউটার',50],['সাঃ জ্ঞান',50],['আকাইদ',100],['বা ও বি',100]],
  '5': [['কুরআন',100],['আরবী ১ম ও ২য়',100],['বাংলা',50],['ইংরেজী',50],['গণিত',60],['বিজ্ঞান',40]],
  '6': [['কোরআন',100],['আকাইদ',100],['আরবী ১ম',100],['আরবী ২য়',100],['বাংলা ১ম',100],['বাংলা ২য়',50],['ইংরেজী ১ম',100],['ইংরেজী ২য়',50],['গণিত',100],['বিজ্ঞান',100],['তথ্য প্রযুক্তি',50],['কৃষি',50],['বা ও বি',100]]
};

const CLASS_NAMES = {
  play:'প্লে', nursery:'নার্সারি', '1':'১ম', '2':'২য়',
  '3':'৩য়', '4':'৪র্থ', '5':'৫ম', '6':'৬ষ্ঠ'
};

/* ============================================================
   3) গ্রেডিং
   ============================================================ */
function calcGrade(mark, full) {
  const p = (mark / full) * 100;
  if (p >= 80) return { point:5.0, grade:'A+' };
  if (p >= 70) return { point:4.0, grade:'A' };
  if (p >= 60) return { point:3.5, grade:'A-' };
  if (p >= 50) return { point:3.0, grade:'B' };
  if (p >= 40) return { point:2.0, grade:'C' };
  if (p >= 33) return { point:1.0, grade:'D' };
  return { point:0.0, grade:'F' };
}

/* ============================================================
   4) DENSE RANKING সহ ডাটা প্রসেস
   (একই নম্বর → একই মেধাস্থান, পরের জনের র‍্যাংক ১ করে বাড়বে না)
   ============================================================ */
function processClass(classKey) {
  const students = RAW_DATA[classKey];
  const subjects = SUBJECTS[classKey];

  let list = students.map(st => {
    let total = 0, full = 0, isFail = false, gpaPts = 0;
    st.marks.forEach((m, i) => {
      const fm = subjects[i][1];
      total += m; full += fm;
      const g = calcGrade(m, fm);
      if (g.grade === 'F') isFail = true;
      gpaPts += g.point;
    });

    let gpa = 0, lg = 'F';
    if (!isFail && total > 0) {
      const avg = gpaPts / st.marks.length;
      gpa = parseFloat(avg.toFixed(2));
      if (gpa >= 5.0) { gpa = 5.00; lg = 'A+'; }
      else if (gpa >= 4.0) lg = 'A';
      else if (gpa >= 3.5) lg = 'A-';
      else if (gpa >= 3.0) lg = 'B';
      else if (gpa >= 2.0) lg = 'C';
      else if (gpa >= 1.0) lg = 'D';
      else lg = 'F';
    }

    return {
      ...st,
      classKey,
      className: CLASS_NAMES[classKey],
      subjects,
      totalObtained: total,
      totalFull: full,
      gpa: gpa.toFixed(2),
      lg,
      isFail
    };
  });

  // সাজানো: ফেল সবশেষে → GPA → মোট নম্বর
  list.sort((a, b) => {
    if (a.isFail && !b.isFail) return 1;
    if (!a.isFail && b.isFail) return -1;
    if (parseFloat(b.gpa) !== parseFloat(a.gpa)) return parseFloat(b.gpa) - parseFloat(a.gpa);
    return b.totalObtained - a.totalObtained;
  });

  // Dense Ranking: একই (gpa + total) → একই র‍্যাংক
  let currentRank = 0;
  let prevGpa = null, prevTotal = null;
  let rankCount = 0;

  list = list.map(st => {
    let rankStr = '—';
    if (!st.isFail && st.totalObtained > 0) {
      const gpaNum = parseFloat(st.gpa);
      if (prevGpa === null || gpaNum !== prevGpa || st.totalObtained !== prevTotal) {
        currentRank = rankCount + 1;
      }
      rankStr = String(currentRank);
      st.rankNum = currentRank;
      prevGpa = gpaNum;
      prevTotal = st.totalObtained;
    } else {
      st.rankNum = 999999;
    }
    rankCount++;
    return { ...st, rank: rankStr };
  });

  // sharedRank চেক (একই র‍্যাংকে একাধিক)
  const rankCounts = {};
  list.forEach(st => {
    if (st.rank !== '—') {
      rankCounts[st.rankNum] = (rankCounts[st.rankNum] || 0) + 1;
    }
  });
  list = list.map(st => ({
    ...st,
    sharedRank: st.rank !== '—' && rankCounts[st.rankNum] > 1
  }));

  return list;
}

/* ============================================================
   5) SEARCH INDEX — সব শিক্ষার্থী + বিষয়
   ============================================================ */
let SEARCH_INDEX = [];
function buildIndex() {
  SEARCH_INDEX = [];
  Object.keys(RAW_DATA).forEach(classKey => {
    const processed = processClass(classKey);
    processed.forEach(st => {
      SEARCH_INDEX.push({
        type: 'student',
        id: `${classKey}-${st.id}`,
        title: st.name,
        classKey,
        className: st.className,
        rank: st.rank,
        rankNum: st.rankNum,
        sharedRank: st.sharedRank,
        gpa: st.gpa,
        lg: st.lg,
        marks: st.totalObtained,
        totalFull: st.totalFull,
        isFail: st.isFail,
        subjects: st.subjects,
        subjectMarks: st.marks,
        raw: st
      });
    });
  });
  // বিষয়সমূহ ইনডেক্সে
  Object.keys(SUBJECTS).forEach(classKey => {
    SUBJECTS[classKey].forEach(([name, full]) => {
      if (!SEARCH_INDEX.find(x => x.type === 'subject' && x.title === name && x.classKey === classKey)) {
        SEARCH_INDEX.push({
          type: 'subject',
          id: `sub-${classKey}-${name}`,
          title: name,
          classKey,
          className: CLASS_NAMES[classKey],
          desc: `${CLASS_NAMES[classKey]} শ্রেণির বিষয় — পূর্ণমান ${full}`,
          fullMark: full
        });
      }
    });
  });
}
buildIndex();

/* ============================================================
   6) বাংলা → ফোনেটিক ম্যাপ (স্মার্ট সার্চের জন্য)
   ============================================================ */
function normalize(str) {
  if (!str) return '';
  return String(str)
    .toLowerCase()
    .replace(/[\u0980-\u09FF]/g, c => c) // বাংলা অক্ষর রাখা
    .replace(/[^\w\u0980-\u09FF\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* ফাজি ম্যাচ — ছোট বানান ভুল ধরতে */
function similarity(a, b) {
  if (!a || !b) return 0;
  a = a.toLowerCase(); b = b.toLowerCase();
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.9;

  const m = a.length, n = b.length;
  if (m === 0 || n === 0) return 0;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  const dist = dp[m][n];
  const maxLen = Math.max(m, n);
  return 1 - dist / maxLen;
}

/* ============================================================
   15) AUTOCOMPLETE
   ============================================================ */
function showAutocomplete(query) {
  const q = normalize(query);
  if (!q) { hideAutocomplete(); return; }

  const seen = new Set();
  const suggestions = [];

  SEARCH_INDEX.forEach(item => {
    if (item.type !== 'student') return;
    const n = normalize(item.title);
    if (!n) return;
    const score = similarity(n, q);
    if (score > 0.3 || n.startsWith(q) || n.includes(q)) {
      const key = item.title;
      if (!seen.has(key)) {
        seen.add(key);
        suggestions.push({ title: item.title, class: item.className, score });
      }
    }
  });

  suggestions.sort((a, b) => b.score - a.score);
  const top = suggestions.slice(0, 6);

  if (top.length === 0) { hideAutocomplete(); return; }

  autocomplete.innerHTML = '';
  top.forEach(s => {
    const div = document.createElement('div');
    div.className = 'ac-item';
    div.innerHTML = `
      <span class="ac-icon">👤</span>
      <span class="ac-text">${highlight(s.title, query)}</span>
      <span class="ac-type">${s.class}</span>
    `;
    div.onmousedown = (e) => {
      e.preventDefault();
      searchInput.value = s.title;
      hideAutocomplete();
      performSearch(s.title);
    };
    autocomplete.appendChild(div);
  });
  autocomplete.classList.add('show');
}
function hideAutocomplete() {
  autocomplete.classList.remove('show');
}

/* ============================================================
   16) হাইলাইট
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const safe = escapeHtml(text);
  const q = query.trim();
  if (!q) return safe;
  const parts = q.split(/\s+/).filter(Boolean);
  let result = safe;
  parts.forEach(p => {
    const re = new RegExp(`(${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  });
  return result;
}

/* ============================================================
   17) সার্চ করার মূল ফাংশন
   ============================================================ */
function performSearch(query) {
  currentQuery = query;
  const q = normalize(query);
  if (!q) { clearResults(); return; }

  const words = q.split(/\s+/).filter(Boolean);

  // স্কোরিং
  const scored = SEARCH_INDEX
    .filter(item => {
      if (currentFilter !== 'all') {
        if (item.type !== 'student') return false;
        if (item.classKey !== currentFilter) return false;
      }
      return true;
    })
    .map(item => {
      let score = 0;
      if (item.type === 'student') {
        const nameN = normalize(item.title);
        const classN = normalize(item.className);

        // নাম ম্যাচ
        if (nameN === q) score += 100;
        else if (nameN.startsWith(q)) score += 80;
        else if (nameN.includes(q)) score += 60;

        words.forEach(w => {
          if (nameN.includes(w)) score += 20;
          if (classN.includes(w)) score += 15;
        });

        // ফাজি
        if (score === 0) {
          const sim = similarity(nameN, q);
          if (sim > 0.5) score += sim * 40;
        }

        // মেধাস্থান বোনাস
        if (item.rankNum === 1) score += 10;
        else if (item.rankNum === 2) score += 6;
        else if (item.rankNum === 3) score += 4;

        // GPA বোনাস
        score += parseFloat(item.gpa) * 2;
      } else if (item.type === 'subject') {
        const n = normalize(item.title);
        if (n === q) score += 80;
        else if (n.includes(q)) score += 50;
        words.forEach(w => { if (n.includes(w)) score += 15; });
      }
      return { ...item, _score: score };
    })
    .filter(x => x._score > 0);

  // সাজানো
  if (currentSort === 'relevance') {
    scored.sort((a, b) => b._score - a._score);
  } else if (currentSort === 'rank') {
    scored.sort((a, b) => (a.rankNum || 9999) - (b.rankNum || 9999));
  } else if (currentSort === 'marks') {
    scored.sort((a, b) => (b.marks || 0) - (a.marks || 0));
  } else if (currentSort === 'az') {
    scored.sort((a, b) => a.title.localeCompare(b.title, 'bn'));
  } else if (currentSort === 'za') {
    scored.sort((a, b) => b.title.localeCompare(a.title, 'bn'));
  }

  currentResults = scored;
  visibleCount = PAGE_SIZE;

  // UI স্টেট
  welcomeState.style.display = 'none';
  recentSection.style.display = 'none';

  if (currentResults.length === 0) {
    resultsArea.style.display = 'none';
    emptyState.style.display = 'block';
    sortBar.style.display = 'none';
    renderSuggestions(q);
    return;
  }

  emptyState.style.display = 'none';
  resultsArea.style.display = 'block';
  sortBar.style.display = 'flex';

  // হিস্টরি
  saveRecent(query);

  renderResults();
}

    loadMore.style.display = 'block';
    loadMore.textContent = `আরও দেখুন (${total - visibleCount} টি বাকি)`;
  }
}

/* ============================================================
   19) বিস্তারিত দেখানো (Modal)
   ============================================================ */
function showDetails(item) {
  if (item.type !== 'student') {
    showToast(`📚 ${item.title} — পূর্ণমান ${item.fullMark}`);
    return;
  }
  const st = item.raw;
  const subj = item.subjects;
  const marks = item.subjectMarks;

  let rows = '';
  subj.forEach((s, i) => {
    const m = marks[i];
    const fm = s[1];
    const failed = (m / fm) * 100 < 33;
    const g = calcGrade(m, fm);
    rows += `
      <tr>
        <td style="text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:13px;">${s[0]}</td>
        <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;${failed ? 'color:#e74c3c;' : ''}">${m}</td>
        <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text-dim);font-size:12px;">${fm}</td>
        <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;">${g.grade}</td>
      </tr>
    `;
  });

  const rankClass = item.rankNum === 1 ? 'rank1' : item.rankNum === 2 ? 'rank2' : item.rankNum === 3 ? 'rank3' : '';
  const sharedCls = item.sharedRank ? 'shared' : '';

  const modal = document.createElement('div');
  modal.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn 0.25s ease;backdrop-filter:blur(4px);
  `;
  modal.innerHTML = `
    <div style="
      background:var(--card);width:100%;max-width:520px;max-height:88vh;
      border-radius:20px 20px 0 0;padding:20px;overflow-y:auto;
      animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
    ">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
        <div>
          <div style="font-size:20px;font-weight:700;color:var(--text);">${item.title}</div>
          <div style="font-size:13px;color:var(--text-dim);margin-top:3px;">${item.className} শ্রেণি — ৩য় সেমিস্টার ২০২৬</div>
        </div>
        <button style="
          width:36px;height:36px;border:none;background:var(--bg);border-radius:50%;
          font-size:18px;cursor:pointer;color:var(--text);flex-shrink:0;
        " onclick="this.closest('div[style*=\\'position:fixed\\']').remove()">✕</button>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <span class="rank-badge ${rankClass} ${sharedCls}">🏆 মেধাস্থান ${item.rank}${item.sharedRank ? ' (যুগ্ম)' : ''}</span>
        <span style="background:var(--bg);padding:5px 12px;border-radius:12px;font-size:13px;font-weight:700;">GPA ${item.gpa}</span>
        <span style="background:var(--bg);padding:5px 12px;border-radius:12px;font-size:13px;font-weight:700;">গ্রেড ${item.lg}</span>
      </div>

      <div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;">
          <span style="color:var(--text-dim);">মোট প্রাপ্ত নম্বর:</span>
          <span style="font-weight:700;color:var(--accent);font-size:16px;">${item.marks} / ${item.totalFull}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px;">
          <span style="color:var(--text-dim);">শতকরা:</span>
          <span style="font-weight:700;">${((item.marks/item.totalFull)*100).toFixed(2)}%</span>
        </div>
      </div>

      <div style="font-weight:700;font-size:14px;margin-bottom:8px;">📋 বিষয়ভিত্তিক নম্বর</div>
      <div style="overflow-x:auto;border-radius:10px;border:1px solid var(--border);">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead>
            <tr style="background:var(--primary);color:white;">
              <th style="padding:8px;text-align:left;">বিষয়</th>
              <th style="padding:8px;">প্রাপ্ত</th>
              <th style="padding:8px;">পূর্ণমান</th>
              <th style="padding:8px;">গ্রেড</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

      <button style="
        width:100%;margin-top:16px;padding:14px;background:var(--primary);color:white;
        border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
        font-family:inherit;
      " onclick="this.closest('div[style*=\\'position:fixed\\']').remove()">বন্ধ করুন</button>
    </div>
    <style>
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    </style>
  `;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

/* ============================================================
   20) Empty State সাজেশন
   ============================================================ */
function renderSuggestions(q) {
  const similar = [];
  SEARCH_INDEX.filter(x => x.type === 'student').forEach(item => {
    const n = normalize(item.title);
    const sim = similarity(n, q);
    if (sim > 0.35) similar.push({ ...item, sim });
  });
  similar.sort((a, b) => b.sim - a.sim);

  const top = similar.slice(0, 5);
  suggestionsEl.innerHTML = '';

  if (top.length > 0) {
    emptyText.innerHTML = `আপনি হয়তো এটি খুঁজছেন 👇`;
    top.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-chip';
      btn.textContent = s.title;
      btn.onclick = () => {
        searchInput.value = s.title;
        performSearch(s.title);
      };
      suggestionsEl.appendChild(btn);
    });
  } else {
    emptyText.innerHTML = `বানান ঠিক আছে কিনা দেখুন।<br>অথবা জনপ্রিয় নামগুলো দেখুন 👇`;
    ['ফাহিম','হাসান','সাকিব','তাওসিফ'].forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-chip';
      btn.textContent = t;
      btn.onclick = () => {
        searchInput.value = t;
        performSearch(t);
      };
      suggestionsEl.appendChild(btn);
    });
  }
}

/* ============================================================
   21) রিসেট
   ============================================================ */
function clearResults() {
  currentQuery = '';
  currentResults = [];
  resultsArea.style.display = 'none';
  emptyState.style.display = 'none';
  sortBar.style.display = 'none';
  welcomeState.style.display = 'block';
  renderRecent();
}

/* ============================================================
   22) লোড মোর
   ============================================================ */
loadMore.onclick = () => {
  visibleCount += PAGE_SIZE;
  renderResults();
};

/* ============================================================
   23) সর্ট
   ============================================================ */
sortSelect.onchange = () => {
  currentSort = sortSelect.value;
  if (currentQuery) performSearch(currentQuery);
};

/* ============================================================
   24) ভয়েস সার্চ
   ============================================================ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'bn-BD';
  recognition.continuous = false;
  recognition.interimResults = false;

  btnVoice.onclick = () => {
    try {
      recognition.start();
      btnVoice.classList.add('listening');
      showToast('🎤 বলুন...');
    } catch (e) {
      showToast('❌ মাইক্রোফোন চালু করা যায়নি');
    }
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    searchInput.value = text;
    btnClear.classList.add('visible');
    performSearch(text.trim());
  };
  recognition.onend = () => btnVoice.classList.remove('listening');
  recognition.onerror = () => {
    btnVoice.classList.remove('listening');
    showToast('❌ ভয়েস সার্চ কাজ করেনি');
  };
} else {
  btnVoice.onclick = () => showToast('❌ এই ব্রাউজারে ভয়েস সার্চ নেই');
}

/* ============================================================
   25) স্ক্রল টপ
   ============================================================ */
window.addEventListener('scroll', () => {
  if (window.scrollY > 300) scrollTop.classList.add('show');
  else scrollTop.classList.remove('show');
});
scrollTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

/* ============================================================
   26) প্রাথমিক অবস্থা
   ============================================================ */
renderRecent();
clearResults();

</script>

</body>
</html>
