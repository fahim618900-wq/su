<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a5f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ফলাফল ২০২৬ | দারুল হিকমাহ মডেল মাদরাসা</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#eef3f5;--card:#fff;--text:#0e2233;--dim:#647687;--border:#dbe4ea;
    --primary:#0e7490;--primary-d:#0b5c72;--accent:#059669;--danger:#dc2626;
    --gold:#d97706;--purple:#7c3aed;--silver:#6b7280;--bronze:#b45309;
    --shadow:0 1px 3px rgba(14,34,51,.06),0 1px 2px rgba(14,34,51,.04);
    --shadow-l:0 10px 25px rgba(14,34,51,.12),0 4px 10px rgba(14,34,51,.06);
    --radius:16px;--radius-s:12px;
  }
  [data-theme="dark"]{
    --bg:#0a121c;--card:#152029;--text:#e6f0f5;--dim:#7d93a5;--border:#233542;
    --primary:#22b8d4;--primary-d:#0e7490;--accent:#10b981;
    --shadow:0 1px 3px rgba(0,0,0,.5);--shadow-l:0 10px 25px rgba(0,0,0,.6);
  }
  html,body{height:100%;font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .25s,color .25s}
  body{display:flex;flex-direction:column;min-height:100vh;max-width:100vw;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}

  /* ============== HEADER ============== */
  .app-header{background:var(--card);padding:12px 14px 10px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);border-bottom:1px solid var(--border)}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .brand-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0;box-shadow:0 3px 8px rgba(14,116,144,.3)}
  .brand-text{min-width:0;flex:1}
  .brand-text h1{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-text p{font-size:10.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .theme-toggle{width:36px;height:36px;border:none;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text);transition:transform .2s,background .2s;flex-shrink:0}
  .theme-toggle:active{transform:scale(.9);background:var(--border)}

  /* ============== SEARCH BOX ============== */
  .search-wrap{position:relative}
  .search-box{display:flex;align-items:center;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:0 4px 0 12px;height:48px;transition:border-color .2s,box-shadow .2s}
  .search-box.focused{border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,116,144,.12)}
  .search-box .icon{font-size:16px;color:var(--dim);margin-right:7px;flex-shrink:0}
  #searchInput{flex:1;border:none;outline:none;background:transparent;font-size:15.5px;color:var(--text);font-family:inherit;padding:0;min-width:0;font-weight:500}
  #searchInput::placeholder{color:var(--dim);font-size:14.5px;font-weight:400}
  .btn-ic{width:36px;height:36px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--dim);transition:background .15s,color .15s;flex-shrink:0;font-family:inherit}
  .btn-ic:active{background:var(--border);color:var(--text)}
  #btnClear{display:none}
  #btnClear.vis{display:flex}
  #btnVoice.listening{background:var(--danger);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}

  /* ============== FILTERS ============== */
  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-ms-overflow-style:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:6px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:18px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;font-family:inherit}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(14,116,144,.25)}
  .chip:active{transform:scale(.94)}

  /* ============== AUTOCOMPLETE ============== */
  .autocomplete{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow-l);max-height:260px;overflow-y:auto;z-index:200;display:none;border:1px solid var(--border);-webkit-overflow-scrolling:touch}
  .autocomplete.show{display:block;animation:dropIn .15s ease}
  @keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .ac-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:9px;transition:background .12s;font-family:inherit}
  .ac-item:last-child{border-bottom:none}
  .ac-item:active{background:var(--bg)}
  .ac-item .ac-ic{font-size:14px;color:var(--primary);flex-shrink:0}
  .ac-item .ac-tx{flex:1;font-weight:500}
  .ac-item mark{background:rgba(5,150,105,.22);color:var(--accent);font-weight:700;padding:1px 2px;border-radius:3px}
  .ac-item .ac-tp{font-size:10.5px;color:var(--dim);background:var(--bg);padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}

  /* ============== SORT BAR ============== */
  .sort-bar{display:none;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--dim);position:sticky;top:98px;z-index:50}
  .sort-bar.show{display:flex}
  .sort-bar select{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:5px 8px;border-radius:8px;font-size:12.5px;font-family:inherit;outline:none;font-weight:600;max-width:150px}
  #resultMeta strong{color:var(--primary);font-weight:700}

  /* ============== MAIN ============== */
  main{flex:1;padding:12px 14px 90px}

  /* ============== RESULT CARDS ============== */
  .result-list{display:flex;flex-direction:column;gap:9px}
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;cursor:pointer;animation:cardIn .25s ease both}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .result-card:active{transform:scale(.985);box-shadow:var(--shadow-l)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
  .card-name{font-size:15.5px;font-weight:700;line-height:1.3;flex:1;word-break:break-word}
  .card-name mark{background:linear-gradient(180deg,transparent 55%,rgba(5,150,105,.35) 55%);color:var(--accent);font-weight:800;padding:0 2px;border-radius:2px}
  .badge-class{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:11px;background:rgba(14,116,144,.14);color:var(--primary);white-space:nowrap;flex-shrink:0}
  [data-theme="dark"] .badge-class{background:rgba(34,184,212,.18)}
  .card-info{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--dim);margin-top:5px}
  .card-info strong{color:var(--text);font-weight:600}
  .rank-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:11px}
  .rank-badge.r1{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .rank-badge.r2{background:linear-gradient(135deg,#94a3b8,#6b7280)}
  .rank-badge.r3{background:linear-gradient(135deg,#d97706,#b45309)}
  .rank-badge.shared{background:linear-gradient(135deg,#7c3aed,#5b21b6)!important}
  .marks-big{font-size:15px;font-weight:800;color:var(--accent)}
  .fail-tag{background:rgba(220,38,38,.14);color:var(--danger);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:11px}
  .rel-bar{position:absolute;bottom:0;left:0;height:2.5px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:0 2.5px 0 0;transition:width .35s}
  .tap-hint{font-size:11px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:5px;opacity:.8}

  /* ============== RECENT ============== */
  .recent-block{margin-bottom:14px;animation:cardIn .3s ease}
  .recent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--text)}
  .recent-head button{font-size:11.5px;color:var(--danger);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:3px 6px;border-radius:6px}
  .recent-head button:active{background:var(--border)}
  .recent-chips{display:flex;flex-wrap:wrap;gap:7px}
  .recent-chip{padding:7px 13px;background:var(--card);border:1px solid var(--border);border-radius:18px;font-size:12.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:500;transition:all .15s}
  .recent-chip:active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* ============== EMPTY ============== */
  .empty-state{text-align:center;padding:50px 20px;animation:cardIn .3s ease}
  .empty-ic{font-size:58px;margin-bottom:14px;opacity:.5}
  .empty-title{font-size:17px;font-weight:700;margin-bottom:7px}
  .empty-tx{font-size:13.5px;color:var(--dim);margin-bottom:18px;line-height:1.6}
  .suggestions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .sug-chip{padding:9px 15px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;font-size:13px;color:var(--primary);font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
  .sug-chip:active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* ============== LOAD MORE ============== */
  .load-more{width:100%;padding:13px;margin-top:14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-s);font-size:13.5px;font-weight:600;color:var(--primary);cursor:pointer;font-family:inherit;transition:all .15s;display:none}
  .load-more.show{display:block}
  .load-more:active{background:var(--bg)}

  /* ============== MODAL ============== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s ease;padding:0}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px;gap:10px}
  .modal-title{font-size:19px;font-weight:700;line-height:1.25;flex:1}
  .modal-sub{font-size:12px;color:var(--dim);margin-top:3px}
  .modal-close{width:34px;height:34px;border:none;background:var(--bg);border-radius:50%;font-size:16px;cursor:pointer;color:var(--text);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .modal-close:active{background:var(--border)}
  .modal-badges{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
  .m-badge{background:var(--bg);padding:5px 11px;border-radius:11px;font-size:12px;font-weight:700}
  .summary-box{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:13px}
  .summary-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .summary-row:last-child{margin-bottom:0}
  .summary-row span:first-child{color:var(--dim)}
  .summary-row span:last-child{font-weight:700}
  .subject-table{width:100%;border-collapse:collapse;font-size:12.5px;border-radius:11px;overflow:hidden;border:1px solid var(--border)}
  .subject-table thead{background:var(--primary);color:#fff}
  .subject-table th,.subject-table td{padding:9px 6px;text-align:center}
  .subject-table th:first-child,.subject-table td:first-child{text-align:left;padding-left:11px}
  .subject-table tbody tr{border-bottom:1px solid var(--border)}
  .subject-table tbody tr:last-child{border-bottom:none}
  .subject-table .sub-name{font-weight:500;font-size:12.5px}
  .subject-table .mk{font-weight:700}
  .subject-table .mk.fail{color:var(--danger)}
  .subject-table .fm{color:var(--dim);font-size:11.5px}
  .subject-table .gr{font-weight:700}
  .subject-table .gr.fail{color:var(--danger)}
  .modal-close-btn{width:100%;margin-top:15px;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
  .modal-close-btn:active{background:var(--primary-d)}

  /* ============== TOAST ============== */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--card);padding:11px 18px;border-radius:22px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-l);z-index:2000;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============== SCROLL TOP ============== */
  .scroll-top{position:fixed;bottom:18px;right:14px;width:44px;height:44px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:18px;box-shadow:var(--shadow-l);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(15px);transition:all .25s;z-index:90;pointer-events:none;font-family:inherit}
  .scroll-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .scroll-top:active{transform:scale(.9)}

  /* ============== INITIAL BLANK ============== */
  #blankState{display:none}
</style>
</head>
<body data-theme="light">

<!-- ============ HEADER ============ -->
<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-logo">🎓</div>
      <div class="brand-text">
        <h1>ফলাফল ২০২৬</h1>
        <p>দারুল হিকমাহ মডেল মাদরাসা</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="থিম">🌙</button>
  </div>

  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <span class="icon">🔎</span>
      <input type="text" id="searchInput" placeholder="শিক্ষার্থীর নাম লিখুন..." autocomplete="off" spellcheck="false" inputmode="search" enterkeyhint="search">
      <button class="btn-ic" id="btnClear" type="button" aria-label="মুছুন">✕</button>
      <button class="btn-ic" id="btnVoice" type="button" aria-label="ভয়েস">🎤</button>
    </div>
    <div class="autocomplete" id="autocomplete"></div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all" type="button">সব</button>
    <button class="chip" data-filter="play" type="button">প্লে</button>
    <button class="chip" data-filter="nursery" type="button">নার্সারি</button>
    <button class="chip" data-filter="1" type="button">১ম</button>
    <button class="chip" data-filter="2" type="button">২য়</button>
    <button class="chip" data-filter="3" type="button">৩য়</button>
    <button class="chip" data-filter="4" type="button">৪র্থ</button>
    <button class="chip" data-filter="5" type="button">৫ম</button>
    <button class="chip" data-filter="6" type="button">৬ষ্ঠ</button>
  </div>
</header>

<div class="sort-bar" id="sortBar">
  <span id="resultMeta">ফলাফল</span>
  <select id="sortSelect">
    <option value="relevance">প্রাসঙ্গিক</option>
    <option value="rank">মেধাস্থান</option>
    <option value="marks">সর্বোচ্চ নম্বর</option>
    <option value="az">নাম (ক→হ)</option>
    <option value="za">নাম (হ→ক)</option>
  </select>
</div>

<main id="main">
  <!-- সম্পূর্ণ খালি প্রাথমিক স্ক্রিন -->
  <div id="blankState"></div>

  <div class="recent-block" id="recentBlock" style="display:none">
    <div class="recent-head">
      <span>🕘 সাম্প্রতিক</span>
      <button id="clearHistory" type="button">মুছুন</button>
    </div>
    <div class="recent-chips" id="recentChips"></div>
  </div>

  <div id="resultsArea" style="display:none">
    <div class="result-list" id="resultList"></div>
    <button class="load-more" id="loadMore" type="button">আরও দেখুন</button>
  </div>

  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-ic">🔍</div>
    <div class="empty-title">কিছু পাওয়া যায়নি</div>
    <div class="empty-tx" id="emptyText">বানান ঠিক আছে কিনা দেখুন</div>
    <div class="suggestions" id="suggestions"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<button class="scroll-top" id="scrollTop" type="button" aria-label="উপরে">↑</button>

   ============================================================ */
function calcGrade(m, f){
  const p = (m/f)*100;
  if(p>=80)return{p:5.0,g:'A+'};
  if(p>=70)return{p:4.0,g:'A'};
  if(p>=60)return{p:3.5,g:'A-'};
  if(p>=50)return{p:3.0,g:'B'};
  if(p>=40)return{p:2.0,g:'C'};
  if(p>=33)return{p:1.0,g:'D'};
  return{p:0.0,g:'F'};
}

/* ============================================================
   4) PROCESS WITH DENSE RANKING
   ============================================================ */
function processClass(ck){
  const subs = SUBJECTS[ck];
  let list = RAW_DATA[ck].map(st=>{
    let tot=0,full=0,fail=false,gp=0;
    st.marks.forEach((m,i)=>{
      const fm=subs[i][1];
      tot+=m;full+=fm;
      const g=calcGrade(m,fm);
      if(g.g==='F')fail=true;
      gp+=g.p;
    });
    let gpa=0,lg='F';
    if(!fail && tot>0){
      const avg=gp/st.marks.length;
      gpa=parseFloat(avg.toFixed(2));
      if(gpa>=5.0){gpa=5.00;lg='A+'}
      else if(gpa>=4.0)lg='A';
      else if(gpa>=3.5)lg='A-';
      else if(gpa>=3.0)lg='B';
      else if(gpa>=2.0)lg='C';
      else if(gpa>=1.0)lg='D';
      else lg='F';
    }
    return{...st,classKey:ck,className:CLASS_NAMES[ck],subjects:subs,total:tot,totalFull:full,gpa:gpa.toFixed(2),lg,isFail:fail};
  });

  list.sort((a,b)=>{
    if(a.isFail&&!b.isFail)return 1;
    if(!a.isFail&&b.isFail)return -1;
    if(parseFloat(b.gpa)!==parseFloat(a.gpa))return parseFloat(b.gpa)-parseFloat(a.gpa);
    return b.total-a.total;
  });

  // DENSE RANKING
  let curRank=0, prevGpa=null, prevTot=null, count=0;
  list = list.map(st=>{
    let rank='—', rankNum=999999;
    if(!st.isFail && st.total>0){
      const g=parseFloat(st.gpa);
      if(prevGpa===null || g!==prevGpa || st.total!==prevTot){
        curRank=count+1;
      }
      rank=String(curRank);
      rankNum=curRank;
      prevGpa=g;prevTot=st.total;
    }
    count++;
    return{...st,rank,rankNum};
  });

  const rc={};
  list.forEach(st=>{if(st.rank!=='—')rc[st.rankNum]=(rc[st.rankNum]||0)+1});
  list = list.map(st=>({...st,sharedRank: st.rank!=='—' && rc[st.rankNum]>1}));
  return list;
}

/* ============================================================
   5) INDEX
   ============================================================ */
let SEARCH_INDEX=[];
function buildIndex(){
  SEARCH_INDEX=[];
  Object.keys(RAW_DATA).forEach(ck=>{
    processClass(ck).forEach(st=>{
      SEARCH_INDEX.push({
        type:'student',id:ck+'-'+st.id,title:st.name,classKey:ck,
        className:st.className,rank:st.rank,rankNum:st.rankNum,
        sharedRank:st.sharedRank,gpa:st.gpa,lg:st.lg,marks:st.total,
        totalFull:st.totalFull,isFail:st.isFail,subjects:st.subjects,
        subjectMarks:st.marks,raw:st
      });
    });
  });
}
buildIndex();

/* ============================================================
   6) HELPERS
   ============================================================ */
function norm(s){return String(s||'').toLowerCase().replace(/[^\w\u0980-\u09FF\s]/g,' ').replace(/\s+/g,' ').trim()}
function sim(a,b){
  if(!a||!b)return 0;
  a=a.toLowerCase();b=b.toLowerCase();
  if(a===b)return 1;
  if(a.includes(b)||b.includes(a))return .9;
  const m=a.length,n=b.length;
  if(!m||!n)return 0;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);
  }
  return 1-dp[m][n]/Math.max(m,n);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hi(text,q){
  const safe=esc(text);
  if(!q)return safe;
  const parts=q.trim().split(/\s+/).filter(Boolean);
  let r=safe;
  parts.forEach(p=>{
    const re=new RegExp('('+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    r=r.replace(re,'<mark>$1</mark>');
  });
  return r;
}

/* ============================================================
   7) STATE
   ============================================================ */
let curFilter='all', curSort='relevance', curQuery='';
let curResults=[], visCount=12;
const PAGE=12;
let recent=JSON.parse(localStorage.getItem('dhm_recent')||'[]');
let theme=localStorage.getItem('dhm_theme')||'light';

/* ============================================================
   8) DOM
   ============================================================ */
const $=id=>document.getElementById(id);
const searchInput=$('searchInput'), searchBox=$('searchBox');
const btnClear=$('btnClear'), btnVoice=$('btnVoice');
const autocomplete=$('autocomplete');
const filtersEl=$('filters'), sortBar=$('sortBar'), sortSelect=$('sortSelect');
const blankState=$('blankState');
const recentBlock=$('recentBlock'), recentChips=$('recentChips'), clearHistory=$('clearHistory');
const resultsArea=$('resultsArea'), resultList=$('resultList'), loadMore=$('loadMore');
const emptyState=$('emptyState'), emptyText=$('emptyText'), suggestionsEl=$('suggestions');
const resultMeta=$('resultMeta');
const themeToggle=$('themeToggle'), scrollTop=$('scrollTop'), toast=$('toast');

/* ============================================================
   9) THEME
   ============================================================ */
function applyTheme(){
  document.body.setAttribute('data-theme',theme);
  themeToggle.textContent=theme==='dark'?'☀️':'🌙';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',theme==='dark'?'#0a121c':'#0e7490');
}
applyTheme();
themeToggle.addEventListener('click',()=>{
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('dhm_theme',theme);
  applyTheme();
  showToast(theme==='dark'?'🌙 ডার্ক মোড':'☀️ লাইট মোড');
});

/* ============================================================
   10) TOAST
   ============================================================ */
let toastT;
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>toast.classList.remove('show'),2000);
}

/* ============================================================
   11) RECENT
   ============================================================ */
function saveRecent(q){
  if(!q||q.length<2)return;
  recent=recent.filter(x=>x!==q);
  recent.unshift(q);
  recent=recent.slice(0,8);
  localStorage.setItem('dhm_recent',JSON.stringify(recent));
}
function renderRecent(){
  if(recent.length===0 || curQuery.length>0){
    recentBlock.style.display='none';
    return;
  }
  recentBlock.style.display='block';
  recentChips.innerHTML='';
  recent.forEach(q=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='recent-chip';
    b.textContent='🕘 '+q;
    b.onclick=()=>{
      searchInput.value=q;
      btnClear.classList.add('vis');
      doSearch(q);
    };
    recentChips.appendChild(b);
  });
}
clearHistory.addEventListener('click',()=>{
  recent=[];
  localStorage.removeItem('dhm_recent');
  renderRecent();
  showToast('✅ মুছে ফেলা হয়েছে');
});

/* ============================================================
   12) FILTERS
   ============================================================ */
filtersEl.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(!chip)return;
  filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  curFilter=chip.dataset.filter;
  if(curQuery)doSearch(curQuery);
});

/* ============================================================
   13) SEARCH INPUT
   ============================================================ */
let debounceT;
searchInput.addEventListener('input',e=>{
  const v=e.target.value;
  btnClear.classList.toggle('vis',v.length>0);
  if(v.length>=1)showAutocomplete(v);
  else hideAutocomplete();

  clearTimeout(debounceT);
  debounceT=setTimeout(()=>{
    const q=v.trim();
    if(q.length>=2)doSearch(q);
    else if(q.length===0)resetAll();
  },200);
});
searchInput.addEventListener('focus',()=>{
  searchBox.classList.add('focused');
  if(searchInput.value.length>=1)showAutocomplete(searchInput.value);
});
searchInput.addEventListener('blur',()=>{
  searchBox.classList.remove('focused');
  setTimeout(hideAutocomplete,180);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    hideAutocomplete();
    const q=searchInput.value.trim();
    if(q)doSearch(q);
  }
});
btnClear.addEventListener('click',()=>{
  searchInput.value='';
  btnClear.classList.remove('vis');
  hideAutocomplete();
  resetAll();
  searchInput.focus();
});

/* ============================================================
   14) AUTOCOMPLETE
   ============================================================ */
function showAutocomplete(q){
  const nq=norm(q);
  if(!nq){hideAutocomplete();return}
  const seen=new Set();
  const sugg=[];
  SEARCH_INDEX.forEach(item=>{
    if(item.type!=='student')return;
    const n=norm(item.title);
    if(!n)return;
    const s=sim(n,nq);
    if(s>0.28 || n.startsWith(nq) || n.includes(nq)){
      if(!seen.has(item.title)){
        seen.add(item.title);
        sugg.push({title:item.title,cls:item.className,score:s});
      }
    }
  });
  sugg.sort((a,b)=>b.score-a.score);
  const top=sugg.slice(0,6);
  if(top.length===0){hideAutocomplete();return}
  autocomplete.innerHTML='';
  top.forEach(s=>{
    const d=document.createElement('div');
    d.className='ac-item';
    d.innerHTML='<span class="ac-ic">👤</span><span class="ac-tx">'+hi(s.title,q)+'</span><span class="ac-tp">'+s.cls+'</span>';
    d.addEventListener('mousedown',e=>{
      e.preventDefault();
      searchInput.value=s.title;
      btnClear.classList.add('vis');
      hideAutocomplete();
      doSearch(s.title);
    });
    d.addEventListener('touchstart',e=>{
      e.preventDefault();
      searchInput.value=s.title;
      btnClear.classList.add('vis');
      hideAutocomplete();
      doSearch(s.title);
    },{passive:false});
    autocomplete.appendChild(d);
  });
  autocomplete.classList.add('show');
}
function hideAutocomplete(){autocomplete.classList.remove('show')}

/* ============================================================
   15) SEARCH
   ============================================================ */
function doSearch(q){
  curQuery=q;
  const nq=norm(q);
  if(!nq){resetAll();return}
  const words=nq.split(/\s+/).filter(Boolean);

  const scored=SEARCH_INDEX
    .filter(item=>{
      if(item.type!=='student')return false;
      if(curFilter!=='all' && item.classKey!==curFilter)return false;
      return true;
    })
    .map(item=>{
      let sc=0;
      const nn=norm(item.title), cn=norm(item.className);
      if(nn===nq)sc+=100;
      else if(nn.startsWith(nq))sc+=80;
      else if(nn.includes(nq))sc+=60;
      words.forEach(w=>{
        if(nn.includes(w))sc+=20;
        if(cn.includes(w))sc+=15;
      });
      if(sc===0){
        const s=sim(nn,nq);
        if(s>0.45)sc+=s*40;
      }
      if(item.rankNum===1)sc+=10;
      else if(item.rankNum===2)sc+=6;
      else if(item.rankNum===3)sc+=4;
      sc+=parseFloat(item.gpa)*2;
      return{...item,_s:sc};
    })
    .filter(x=>x._s>0);

  if(curSort==='relevance')scored.sort((a,b)=>b._s-a._s);
  else if(curSort==='rank')scored.sort((a,b)=>(a.rankNum||9999)-(b.rankNum||9999));
  else if(curSort==='marks')scored.sort((a,b)=>(b.marks||0)-(a.marks||0));
  else if(curSort==='az')scored.sort((a,b)=>a.title.localeCompare(b.title,'bn'));
  else if(curSort==='za')scored.sort((a,b)=>b.title.localeCompare(a.title,'bn'));

  curResults=scored;
  visCount=PAGE;

  recentBlock.style.display='none';
  blankState.style.display='none';

  if(curResults.length===0){
    resultsArea.style.display='none';
    emptyState.style.display='block';
    sortBar.classList.remove('show');
    renderSuggestions(nq);
    return;
  }
  emptyState.style.display='none';
  resultsArea.style.display='block';
  sortBar.classList.add('show');
  saveRecent(q);
  renderResults();
}

/* ============================================================
   16) RENDER RESULTS
   ============================================================ */
function renderResults(){
  const total=curResults.length;
  const shown=Math.min(visCount,total);
  resultMeta.innerHTML='<strong>'+total+'</strong> ফলাফল — দেখানো '+shown;

  resultList.innerHTML='';
  const slice=curResults.slice(0,visCount);

  slice.forEach((item,i)=>{
    const card=document.createElement('div');
    card.className='result-card';
    card.style.animationDelay=Math.min(i*25,250)+'ms';

    const rk = item.rankNum===1?'r1':item.rankNum===2?'r2':item.rankNum===3?'r3':'';
    const sh = item.sharedRank?'shared':'';
    const failTag = item.isFail?'<span class="fail-tag">❌ ফেল</span>':'';

    card.innerHTML =
      '<div class="card-top">'+
        '<div class="card-name">'+hi(item.title,curQuery)+'</div>'+
        '<span class="badge-class">'+item.className+'</span>'+
      '</div>'+
      '<div class="card-info">'+
        '<span>🏆 <span class="rank-badge '+rk+' '+sh+'">মেধাস্থান '+item.rank+(item.sharedRank?' (যুগ্ম)':'')+'</span></span>'+
        '<span>📊 GPA: <strong>'+item.gpa+'</strong></span>'+
        '<span>🎖️ <strong>'+item.lg+'</strong></span>'+
        failTag+
      '</div>'+
      '<div class="card-info">'+
        '<span>📝 প্রাপ্ত: <span class="marks-big">'+item.marks+'</span> / '+item.totalFull+'</span>'+
      '</div>'+
      '<div class="tap-hint">👆 বিষয়ভিত্তিক নম্বর দেখতে ট্যাপ করুন</div>'+
      '<div class="rel-bar" style="width:'+Math.min(100,(item._s/120)*100)+'%"></div>';

    card.addEventListener('click',()=>showDetails(item));
    resultList.appendChild(card);
  });

  if(visCount>=total){
    loadMore.classList.remove('show');
  }else{
    loadMore.classList.add('show');
    loadMore.textContent='আরও দেখুন ('+(total-visCount)+' বাকি)';
  }
}

/* ============================================================
   17) MODAL
   ============================================================ */
function showDetails(item){
  const rk = item.rankNum===1?'r1':item.rankNum===2?'r2':item.rankNum===3?'r3':'';
  const sh = item.sharedRank?'shared':'';

  let rows='';
  item.subjects.forEach((s,i)=>{
    const m=item.subjectMarks[i];
    const fm=s[1];
    const failed=(m/fm)*100<33;
    const g=calcGrade(m,fm);
    rows+='<tr>'+
      '<td class="sub-name">'+s[0]+'</td>'+
      '<td class="mk'+(failed?' fail':'')+'">'+m+'</td>'+
      '<td class="fm">'+fm+'</td>'+
      '<td class="gr'+(failed?' fail':'')+'">'+g.g+'</td>'+
    '</tr>';
  });

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=
    '<div class="modal-sheet">'+
      '<div class="modal-handle"></div>'+
      '<div class="modal-head">'+
        '<div style="flex:1;min-width:0">'+
          '<div class="modal-title">'+esc(item.title)+'</div>'+
          '<div class="modal-sub">'+item.className+' শ্রেণি — ৩য় সেমিস্টার ২০২৬</div>'+
        '</div>'+
        '<button class="modal-close" type="button" aria-label="বন্ধ">✕</button>'+
      '</div>'+
      '<div class="modal-badges">'+
        '<span class="rank-badge '+rk+' '+sh+'">🏆 মেধাস্থান '+item.rank+(item.sharedRank?' (যুগ্ম)':'')+'</span>'+
        '<span class="m-badge">GPA '+item.gpa+'</span>'+
        '<span class="m-badge">গ্রেড '+item.lg+'</span>'+
      '</div>'+
      '<div class="summary-box">'+
        '<div class="summary-row"><span>মোট প্রাপ্ত নম্বর</span><span style="color:var(--accent);font-size:16px">'+item.marks+' / '+item.totalFull+'</span></div>'+
        '<div class="summary-row"><span>শতকরা</span><span>'+((item.marks/item.totalFull)*100).toFixed(2)+'%</span></div>'+
      '</div>'+
      '<div style="font-weight:700;font-size:13.5px;margin-bottom:8px">📋 বিষয়ভিত্তিক নম্বর</div>'+
      '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:11px">'+
        '<table class="subject-table">'+
          '<thead><tr><th>বিষয়</th><th>প্রাপ্ত</th><th>পূর্ণ</th><th>গ্রেড</th></tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table>'+
      '</div>'+
      '<button class="modal-close-btn" type="button">বন্ধ করুন</button>'+
    '</div>';

  overlay.addEventListener('click',e=>{
    if(e.target===overlay)overlay.remove();
  });
  const closeBtn=overlay.querySelector('.modal-close');
  const closeBtn2=overlay.querySelector('.modal-close-btn');
  closeBtn.addEventListener('click',()=>overlay.remove());
  closeBtn2.addEventListener('click',()=>overlay.remove());

  document.body.appendChild(overlay);
  document.body.style.overflow='hidden';
  const obs=new MutationObserver(()=>{
    if(!document.body.contains(overlay)){
      document.body.style.overflow='';
      obs.disconnect();
    }
  });
  obs.observe(document.body,{childList:true});
}

/* ============================================================
   18) SUGGESTIONS
   ============================================================ */
function renderSuggestions(nq){
  const similar=[];
  SEARCH_INDEX.filter(x=>x.type==='student').forEach(item=>{
    const n=norm(item.title);
    const s=sim(n,nq);
    if(s>0.35)similar.push({...item,sim:s});
  });
  similar.sort((a,b)=>b.sim-a.sim);
  const top=similar.slice(0,5);
  suggestionsEl.innerHTML='';
  if(top.length>0){
    emptyText.textContent='আপনি হয়তো এগুলো খুঁজছেন 👇';
    top.forEach(s=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='sug-chip';
      b.textContent=s.title;
      b.onclick=()=>{
        searchInput.value=s.title;
        btnClear.classList.add('vis');
        doSearch(s.title);
      };
      suggestionsEl.appendChild(b);
    });
  }else{
    emptyText.textContent='বানান ঠিক আছে কিনা দেখুন';
  }
}

/* ============================================================
   19) RESET
   ============================================================ */
function resetAll(){
  curQuery='';
  curResults=[];
  resultsArea.style.display='none';
  emptyState.style.display='none';
  sortBar.classList.remove('show');
  blankState.style.display='block';
  renderRecent();
}

/* ============================================================
   20) LOAD MORE
   ============================================================ */
loadMore.addEventListener('click',()=>{
  visCount+=PAGE;
  renderResults();
});

/* ============================================================
   21) SORT
   ============================================================ */
sortSelect.addEventListener('change',()=>{
  curSort=sortSelect.value;
  if(curQuery)doSearch(curQuery);
});

/* ============================================================
   22) VOICE
   ============================================================ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();
  rec.lang='bn-BD';
  rec.continuous=false;
  rec.interimResults=false;
  btnVoice.addEventListener('click',()=>{
    try{
      rec.start();
      btnVoice.classList.add('listening');
      showToast('🎤 বলুন...');
    }catch(e){
      showToast('❌ মাইক্রোফোন চালু হয়নি');
    }
  });
  rec.onresult=e=>{
    const txt=e.results[0][0].transcript;
    searchInput.value=txt;
    btnClear.classList.add('vis');
    doSearch(txt.trim());
  };
  rec.onend=()=>btnVoice.classList.remove('listening');
  rec.onerror=()=>{
    btnVoice.classList.remove('listening');
    showToast('❌ ভয়েস কাজ করেনি');
  };
}else{
  btnVoice.addEventListener('click',()=>showToast('❌ এই ব্রাউজারে ভয়েস নেই'));
}

/* ============================================================
   23) SCROLL TOP
   ============================================================ */
let scrollT;
window.addEventListener('scroll',()=>{
  clearTimeout(scrollT);
  scrollT=setTimeout(()=>{
    if(window.scrollY>300)scrollTop.classList.add('show');
    else scrollTop.classList.remove('show');
  },80);
},{passive:true});
scrollTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ============================================================
   24) INIT
   ============================================================ */
function init(){
  // সম্পূর্ণ খালি স্ক্রিন — শুধু Recent থাকলে দেখাবে
  blankState.style.display='block';
  renderRecent();
}
init();

</script>
